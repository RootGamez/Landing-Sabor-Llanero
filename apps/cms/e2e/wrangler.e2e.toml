# Config de Wrangler SOLO para los E2E del CMS (docs/PLAN_BACKOFFICE.md, F10) — NO desplegar con esto.
#
# La API corre en local (Miniflare) con una persistencia AISLADA en e2e/.state
# (gitignored): nunca toca la D1 local del dueño (apps/api/.wrangler) ni la real.
# - Sin R2 (el config real usa `remote = true`, que pegaría al bucket real).
# - Sin bindings de rate limit: `rateLimit()` degrada a no-op, así los E2E pueden
#   iniciar sesión las veces que haga falta sin chocar con el límite de 10/min.
# - Sin MAIL_LAMBDA_*: `sendEmail` no envía nada.
# - Secretos de juguete: no sirven en ningún otro entorno.
name = "sabor-llanero-e2e"
main = "../../api/src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "sabor-llanero-e2e"
# Placeholder deliberado, NUNCA el id real: un `--remote` por error no podría
# resolver ninguna base de la cuenta.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../api/migrations"

[vars]
ENVIRONMENT = "development"
JWT_SECRET = "e2e-only-jwt-secret-never-use-in-production"
CUSTOMER_JWT_SECRET = "e2e-only-customer-jwt-secret-never-use-in-production"
