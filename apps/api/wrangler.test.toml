# Config de Wrangler SOLO para tests (P1.6) — NO desplegar con esto.
#
# Deliberadamente más chico que wrangler.toml: omite MEDIA (R2), con
# `remote = true` en el config real, es decir que incluso en dev local depende
# de un servicio real de Cloudflare. Omitirlo acá es seguro: el binding es
# opcional en `Bindings` (env.ts) y la superficie bajo test nunca lo requiere.
# Tampoco se definen MAIL_LAMBDA_URL/MAIL_LAMBDA_SECRET: sin ellos `sendEmail`
# no hace nada, y los tests que lo ejercitan mockean `fetch`. Así los tests
# corren 100% locales/offline, sin login a Cloudflare ni acceso de red.
name = "sabor-llanero-api-test"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "sabor-llanero-test"
# Placeholder deliberado, NUNCA el id real de wrangler.toml: Cloudflare
# resuelve D1 remoto por database_id (no por database_name), así que
# reusar el real acá era un footgun — un `--remote` corrido por error contra
# este config golpearía la base de producción. Local/Miniflare nunca resuelve
# este id contra la cuenta real, así que cualquier UUID sirve.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "development"
JWT_SECRET = "test-only-jwt-secret-never-use-in-production"
CUSTOMER_JWT_SECRET = "test-only-customer-jwt-secret-never-use-in-production"
